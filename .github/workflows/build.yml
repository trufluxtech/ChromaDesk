name: Cross-platform build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            aqt_host: windows
            qt_arch: win64_msvc2022_64
            qt_dir: msvc2022_64
          - os: macos-14
            aqt_host: mac
            qt_arch: clang_64
            qt_dir: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt
        shell: bash
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt "${{ matrix.aqt_host }}" desktop 6.8.3 "${{ matrix.qt_arch }}" --outputdir "$RUNNER_TEMP/Qt"
      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}"
          -DCHROMADESK_ENABLE_RAW=OFF
          -DCHROMADESK_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
